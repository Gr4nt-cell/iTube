name: Build APK

# Builds now run on Codemagic (codemagic.yaml). This workflow stays available to run by hand.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ITUBE_KEYSTORE_BASE64 }}
          ITUBE_KEYSTORE_PASSWORD: ${{ secrets.ITUBE_KEYSTORE_PASSWORD }}
          ITUBE_KEY_ALIAS: ${{ secrets.ITUBE_KEY_ALIAS }}
          ITUBE_KEY_PASSWORD: ${{ secrets.ITUBE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Set ITUBE_KEYSTORE_BASE64 in repository Actions secrets}"
          : "${ITUBE_KEYSTORE_PASSWORD:?Set ITUBE_KEYSTORE_PASSWORD in repository Actions secrets}"
          : "${ITUBE_KEY_ALIAS:?Set ITUBE_KEY_ALIAS in repository Actions secrets}"
          : "${ITUBE_KEY_PASSWORD:?Set ITUBE_KEY_PASSWORD in repository Actions secrets}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          printf 'ITUBE_KEYSTORE_FILE=%s\n' "$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ITUBE_KEYSTORE_PASSWORD: ${{ secrets.ITUBE_KEYSTORE_PASSWORD }}
          ITUBE_KEY_ALIAS: ${{ secrets.ITUBE_KEY_ALIAS }}
          ITUBE_KEY_PASSWORD: ${{ secrets.ITUBE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Save build log on failure
        if: failure()
        run: |
          grep -nE "^e: |error:|FAILURE|What went wrong|Could not|> " build.log | head -300 > failure.txt || true
          tail -150 build.log >> failure.txt || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null
          git add -f failure.txt
          git commit -m "Build log for ${{ github.sha }}"
          git push -f origin ci-logs

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/iTube-${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iTube-apk
          path: out/*.apk

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: iTube ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build {0}', github.run_number) }}
          files: out/*.apk
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
