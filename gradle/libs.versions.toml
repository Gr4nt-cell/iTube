[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.08.00"
compose = "1.12.1"
materialIcons = "1.7.8"
activity = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.9.2"
media3 = "1.11.1"
haze = "2.0.1"
coil = "3.6.2"
okhttp = "4.12.0"
serialization = "1.9.0"
coroutines = "1.10.2"
work = "2.11.2"
webkit = "1.15.0"
